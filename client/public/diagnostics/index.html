<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>AimoMusic API 体检器 2.0</title><style>:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;background:light-dark(#f5f6fa,#101218);color:light-dark(#1a2331,#e9edf5)}main{max-width:850px;margin:auto;padding:30px 16px 60px}h1{font-size:1.8rem;margin:0 0 8px}p{line-height:1.65;color:light-dark(#4e5968,#b8c0cf)}.panel{border:1px solid light-dark(#dce1e8,#343b48);border-radius:16px;padding:18px;margin-top:16px;background:light-dark(white,#1b202a)}label{display:block;font-weight:650;margin:12px 0 6px}input[type=text]{width:100%;padding:12px;border-radius:9px;border:1px solid #8893a5;background:transparent;color:inherit;font:inherit}button{border:0;border-radius:10px;padding:12px 16px;font-weight:650;cursor:pointer;background:#2563eb;color:white;margin:8px 8px 0 0}button.secondary{background:light-dark(#e8edf6,#30394a);color:inherit}button:disabled{opacity:.5;cursor:not-allowed}.item{border-top:1px solid light-dark(#e0e4eb,#363e4b);padding:13px 0}.item:first-child{border:0}.item b{display:block}.meta{font-size:.87rem;color:light-dark(#566174,#b5bfd0);margin-top:5px;overflow-wrap:anywhere}.good{color:#16a34a}.bad{color:#e35a5a}.warn{color:#c68b1d}small{line-height:1.6}code{overflow-wrap:anywhere}#log{white-space:pre-wrap;font-size:.85rem;line-height:1.5}input[type=checkbox]{accent-color:#2563eb} .foot{font-size:.83rem}</style></head><body><main><h1>AimoMusic API 体检器 <span style="font-size:.55em;opacity:.65">2.0</span></h1><p>专为 Cloudflare Pages 部署准备。关闭 VPN 后在 Pages 域名打开，点击一次即可检测 CurrentStation 的搜索、歌词、歌曲详情、播放地址及传统接口的访问情况。</p><div class="panel"><label for="base">接口域名</label><input id="base" type="text" value="https://music.20110208.xyz" spellcheck="false"><label for="song">测试歌曲 ID（网易云歌曲 ID）</label><input id="song" type="text" value="186016" inputmode="numeric"><label><input type="checkbox" id="legacy" checked> 同时检查传统接口（用于确认是否仍可访问）</label><label><input type="checkbox" id="probe" checked> 检查音频地址是否返回（不会下载或播放音频）</label><button id="run">开始一键检测</button><button class="secondary" id="save" disabled>下载 JSON 报告</button><button class="secondary" id="copy" disabled>复制报告</button><p class="foot">仅发起公开、只读 GET；不发送 Cookie、Token 或登录请求。不会自动尝试未知路径，不会访问返回的音频 CDN 地址。报告仅包含结构摘要和经过筛选的诊断字段，不包含歌词全文或音频播放链接。</p></div><div class="panel"><strong id="status">等待开始检测</strong><div id="results"></div></div><div class="panel"><strong>环境信息</strong><div id="env" class="meta"></div></div></main><script>
'use strict';
const $=id=>document.getElementById(id);let report=null;
const now=()=>new Date().toISOString();
function envInfo(){return {origin:location.origin,protocol:location.protocol,host:location.host,secureContext:isSecureContext,userAgent:navigator.userAgent,language:navigator.language,online:navigator.onLine,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone};}
$('env').textContent=JSON.stringify(envInfo(),null,2);
const shape=(v,depth=0)=>{if(v===null)return 'null';if(Array.isArray(v))return {type:'array',length:v.length,item:depth<4&&v.length?shape(v[0],depth+1):null};if(typeof v==='object'){if(depth>=4)return 'object';return Object.fromEntries(Object.entries(v).slice(0,28).map(([k,val])=>[k,shape(val,depth+1)]));}return typeof v;};
function extract(data,name){const o={};if(!data||typeof data!=='object')return o;if(typeof data.code==='number'||typeof data.code==='string')o.apiCode=data.code;if(typeof data.ok==='boolean')o.ok=data.ok;if(name.includes('搜索')){const songs=data.songs||data.result?.songs;if(Array.isArray(songs)){o.songCount=songs.length;o.songFields=songs[0]?Object.keys(songs[0]).slice(0,35):[];o.sampleSongId=songs[0]?.ncm_id??songs[0]?.id??null;}}if(name.includes('歌词')){o.linesCount=Array.isArray(data.lines)?data.lines.length:null;o.hasLegacyLrc=typeof data.lrc?.lyric==='string';o.isYrc=data.isYrc??null;}if(name.includes('播放')){const item=Array.isArray(data.data)?data.data[0]:data.data??data.result??data;o.hasAudioUrl=typeof item?.url==='string'&&item.url.length>0;o.audioUrlScheme=o.hasAudioUrl?(()=>{try{return new URL(item.url).protocol}catch{return 'invalid'}})():null;o.audioFields=item&&typeof item==='object'?Object.keys(item).slice(0,25):[];o.fee=item?.fee??null;o.code=item?.code??null;}return o;}
async function test(spec,base,timeout=14000){const started=performance.now();const url=new URL(base.replace(/\/$/,'')+spec.path);Object.entries(spec.query||{}).forEach(([k,v])=>url.searchParams.set(k,String(v)));const controller=new AbortController();const timer=setTimeout(()=>controller.abort('timeout'),timeout);const row={name:spec.name,method:'GET',path:spec.path,query:spec.query||{},status:null,elapsedMs:0,result:'pending'};try{const response=await fetch(url.toString(),{method:'GET',mode:'cors',credentials:'omit',cache:'no-store',signal:controller.signal,headers:{Accept:'application/json'}});row.status=response.status;row.contentType=response.headers.get('content-type');const text=await response.text();row.responseBytes=new TextEncoder().encode(text).length;let data;try{data=JSON.parse(text)}catch{row.result=response.ok?'invalid_json':'http_error';row.bodyLooksHtml=/^\s*</.test(text);return row;}row.shape=shape(data);row.diagnostics=extract(data,spec.name);row.result=response.ok?'reachable':'http_error';return row;}catch(e){row.result=controller.signal.aborted?'timeout':'network_or_cors_error';row.error=controller.signal.aborted?'请求超时':String(e?.name||'FetchError')+': '+String(e?.message||'无法读取响应').slice(0,150);return row;}finally{clearTimeout(timer);row.elapsedMs=Math.round(performance.now()-started);}}
function specs(id,legacy,probe){const x=[{name:'CurrentStation 健康检查',path:'/cm/health'},{name:'CurrentStation 首屏数据',path:'/cm/bootstrap'},{name:'CurrentStation 网易云搜索',path:'/cm/ncm/search',query:{keywords:'周杰伦',limit:3,type:1}},{name:'CurrentStation 网易云歌词',path:'/cm/ncm/lyric',query:{id}},{name:'CurrentStation 网易云歌曲详情',path:'/cm/ncm/song/detail',query:{ids:id}},{name:'CurrentStation 网易云歌曲详情（单 ID）',path:'/cm/ncm/song/detail',query:{id}}];if(probe)x.push({name:'CurrentStation 网易云播放地址 V1',path:'/cm/ncm/song/url/v1',query:{id,level:'standard'}},{name:'CurrentStation 网易云播放地址',path:'/cm/ncm/song/url',query:{id,br:128000}});if(legacy)x.push({name:'传统网易云搜索',path:'/search',query:{keywords:'周杰伦',limit:3,type:1}},{name:'传统网易云歌曲详情',path:'/song/detail',query:{ids:id}},{name:'传统网易云歌词',path:'/lyric',query:{id}});if(legacy&&probe)x.push({name:'传统网易云播放地址',path:'/song/url/v1',query:{id,level:'standard'}});return x;}
function display(row){const e=document.createElement('div');e.className='item';const b=document.createElement('b');b.textContent=row.name;const m=document.createElement('div');m.className='meta';m.textContent=`${row.path} · ${row.status??'无 HTTP 状态'} · ${row.elapsedMs} ms · ${row.result}`;m.className+=' '+(row.result==='reachable'?'good':row.result==='http_error'?'warn':'bad');e.append(b,m);$('results').append(e);}
$('run').onclick=async()=>{let base=$('base').value.trim();try{const u=new URL(base);if(u.protocol!=='https:'||u.username||u.password||u.search||u.hash||u.pathname!=='/')throw Error();base=u.origin;}catch{alert('请填写仅含域名的 HTTPS 地址，例如 https://music.20110208.xyz');return;}const id=$('song').value.trim();if(!/^\d{1,18}$/.test(id)){alert('歌曲 ID 应为数字');return;}$('run').disabled=true;$('save').disabled=true;$('copy').disabled=true;$('results').replaceChildren();const all=specs(id,$('legacy').checked,$('probe').checked);report={tool:'AimoMusic API 体检器',version:'2.0.0',testedAt:now(),environment:envInfo(),base,requestMode:'cors',credentials:'omit',vpnStatus:'由用户自行确认；网页无法可靠检测 VPN 是否开启',notes:['仅测试公开只读 GET','请求失败不能单独证明 CORS 问题','本工具不会播放或下载音频','歌曲详情与播放地址路径基于常见代理形式探测，HTTP 失败不证明服务没有其他可用路径','报告不包含完整 JSON、歌词正文或音频 URL'],tests:[]};for(let i=0;i<all.length;i++){$('status').textContent=`检测中 ${i+1} / ${all.length}`;const row=await test(all[i],base);report.tests.push(row);display(row);}const ok=report.tests.filter(x=>x.result==='reachable').length;$('status').textContent=`检测完成：${ok} / ${all.length} 项成功`;$('run').disabled=false;$('save').disabled=false;$('copy').disabled=false;};
function reportText(){return JSON.stringify(report,null,2)}$('save').onclick=()=>{if(!report)return;const blob=new Blob([reportText()],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='AimoMusic_API_体检报告_2.0.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};$('copy').onclick=async()=>{if(!report)return;try{await navigator.clipboard.writeText(reportText());$('copy').textContent='已复制'}catch{alert('复制失败，请使用下载报告按钮')}setTimeout(()=>$('copy').textContent='复制报告',1500)};
</script></body></html>
